name: Check

# リリース用タグを打つ前に、main 向けPRで release.yml と同じチェックを走らせる。
# windows-latest にするのは、checkout の CRLF 変換で回帰テストが
# 落ちるケースをリリース前に見つけるため（ubuntu だと見落とす）。
on:
  pull_request:
    branches: [main]

concurrency:
  group: check-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: windows-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run checks
        run: npm run check
