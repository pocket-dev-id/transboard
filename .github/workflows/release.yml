name: Release

on:
  push:
    tags:
      - 'v*'

jobs:
  build:
    runs-on: windows-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.23.x'
          cache: true

      - name: Setup Node.js for frontend checks
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Install frontend check dependencies
        run: npm ci

      - name: Install Wails CLI
        shell: pwsh
        run: |
          $env:GOBIN = Join-Path $env:RUNNER_TEMP 'go-bin'
          New-Item -ItemType Directory -Path $env:GOBIN -Force | Out-Null
          go install github.com/wailsapp/wails/v2/cmd/wails@v2.10.2
          "$env:GOBIN" | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append

      - name: Install NSIS
        shell: pwsh
        run: choco install nsis --yes --no-progress

      - name: Run Go tests
        run: go test ./...

      - name: Run frontend checks
        run: npm run check

      - name: Build Windows application
        run: wails build -nsis

      - name: Verify release artifacts
        shell: pwsh
        run: |
          $required = @(
            'build\bin\TransBoard.exe',
            'build\bin\TransBoard-amd64-installer.exe'
          )
          foreach ($path in $required) {
            if (-not (Test-Path -LiteralPath $path)) {
              throw "Required release artifact was not generated: $path"
            }
          }

      - name: Verify configured Authenticode signature
        if: ${{ secrets.UPDATE_PUBLISHER_NAME != '' && secrets.UPDATE_PUBLISHER_THUMBPRINT != '' }}
        shell: pwsh
        env:
          UPDATE_PUBLISHER_NAME: ${{ secrets.UPDATE_PUBLISHER_NAME }}
          UPDATE_PUBLISHER_THUMBPRINT: ${{ secrets.UPDATE_PUBLISHER_THUMBPRINT }}
        run: |
          $file = Get-Item -LiteralPath 'build\bin\TransBoard.exe'
          $signature = Get-AuthenticodeSignature -LiteralPath $file.FullName
          $publisher = if ($signature.SignerCertificate) {
            $signature.SignerCertificate.GetNameInfo(
              [Security.Cryptography.X509Certificates.X509NameType]::SimpleName,
              $false
            )
          } else { '' }
          $thumbprint = if ($signature.SignerCertificate) {
            ($signature.SignerCertificate.Thumbprint -replace '[^0-9a-fA-F]', '').ToUpperInvariant()
          } else { '' }
          $expectedThumbprint = ($env:UPDATE_PUBLISHER_THUMBPRINT -replace '[^0-9a-fA-F]', '').ToUpperInvariant()
          if ($signature.Status -ne 'Valid' -or $publisher -ne $env:UPDATE_PUBLISHER_NAME -or $thumbprint -ne $expectedThumbprint) {
            throw "Invalid signature or publisher: $($file.FullName)"
          }

      - name: Generate Go update manifest
        shell: pwsh
        run: |
          $file = Get-Item -LiteralPath 'build\bin\TransBoard.exe'
          $version = "${{ github.ref_name }}".TrimStart('v')
          $manifest = [ordered]@{
            version = $version
            file = 'TransBoard.exe'
            size = $file.Length
            hash = (Get-FileHash -LiteralPath $file.FullName -Algorithm SHA256).Hash.ToLowerInvariant()
            url = 'TransBoard.exe'
          }
          $manifest | ConvertTo-Json | Set-Content -LiteralPath 'build\manifest.json' -Encoding utf8NoBOM

      - name: Upload to GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            build/bin/TransBoard.exe
            build/bin/TransBoard-amd64-installer.exe
            build/manifest.json
          generate_release_notes: true
